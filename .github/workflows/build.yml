name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the tag release step
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # Fork PRs get no secrets, so the keystore is empty there and the debug key is used.
      - name: Decode keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              echo "GLASSHOUSE_STORE_FILE=release.jks"
              echo "GLASSHOUSE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "GLASSHOUSE_KEY_ALIAS=$KEY_ALIAS"
              echo "GLASSHOUSE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          mv "$apk" "glasshouse-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: glasshouse-${{ env.VERSION_NAME }}
          path: glasshouse-${{ env.VERSION_NAME }}.apk

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: glasshouse-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f release.jks
